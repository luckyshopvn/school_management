# Môi trường phát triển trên máy cục bộ (YCTD-32)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  # Kho tệp tương thích S3 khi phát triển (YCTD-45); khi triển khai dùng kho của nhà cung cấp đám mây (T6)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -dir=/data
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data
volumes:
  postgres-data:
  seaweedfs-data:
