# Ghi hình lớp video (LiveKit Egress; DT-27 phần 27a, YCTD-251). Tệp mẫu: các chỗ __TÊN__ được thay từ biến môi trường lúc khởi động.
# Máy chủ API chỉ định nơi ghi cho từng bản ghi (kho tệp S3 của hệ thống, khoá theo storageKey('video-recordings', …)) nên tệp này
# không chứa khoá kho tệp. Mỗi bản ghi 720p đồng thời cần khoảng 2 đến 4 nhân (chưa xác minh, đo ở bước E-05).
log_level: info
api_key: __LIVEKIT_API_KEY__
api_secret: __LIVEKIT_API_SECRET__
ws_url: ws://livekit:7880
redis:
  address: redis:6379
  password: __REDIS_PASSWORD__
  db: 3
