# Môi trường chạy thật trên một máy chủ Linux với Docker Compose (YCTD-92, việc T6).
# Chạy từ thư mục gốc kho mã nguồn:
#   docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env up -d --build
# Chỉ dịch vụ `web` (Caddy) mở cổng ra ngoài; PostgreSQL, Redis, kho tệp, máy chủ API, dịch vụ định danh chỉ nghe trong mạng
# nội bộ của Docker. Hướng dẫn đầy đủ: deploy/README.md.
name: ${COMPOSE_PROJECT_NAME:-school-management}

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-node-environment: &node-environment
  NODE_ENV: ${NODE_ENV:-production}
  TZ: Asia/Ho_Chi_Minh
  # Máy chủ chuyển tiếp Caddy ở mạng nội bộ của Docker; tin X-Forwarded-For từ các địa chỉ nội bộ
  TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
  TOKEN_PUBLIC_KEY: ${TOKEN_PUBLIC_KEY:?Thiếu TOKEN_PUBLIC_KEY}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?Thiếu IDENTITY_DATABASE_PASSWORD}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Thiếu API_DATABASE_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Tạo tài khoản identity_service, api_service (có CREATEDB để mở năm học, QĐ-21) và hai cơ sở dữ liệu ở lần chạy đầu
      - ../docker/postgres/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Kho tệp tương thích S3 chạy cùng máy (YCTD-45). Khi dùng kho đối tượng của nhà cung cấp đám mây: đặt S3_ENDPOINT,
  # S3_BUCKET, khóa truy cập của nhà cung cấp trong .env và chạy không có dịch vụ này (COMPOSE_PROFILES để trống)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    profiles: ['seaweedfs']
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Thiếu S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Thiếu S3_SECRET_ACCESS_KEY}
    # Bật kiểm tra khóa truy cập S3 bằng tệp cấu hình sinh lúc khởi động từ biến môi trường
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '{"identities":[{"name":"school","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -s3 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  # Máy chủ chuyển tiếp WebRTC coturn tự host (DT-23 phần 23e, YCTD-215; dùng chung về sau cho 27a): giúp trình duyệt giáo viên
  # và học sinh nối với nhau khi tường lửa chặn kết nối trực tiếp. Hình xem trực tiếp đi qua đây ở dạng mã hoá (DTLS-SRTP),
  # coturn không lưu hình. Tuỳ chọn: bật bằng COMPOSE_PROFILES=coturn và đặt STUN_URLS, TURN_URLS, TURN_SHARED_SECRET,
  # TURN_EXTERNAL_IP; chạy ở mạng của máy chủ (network_mode host) để mở dải cổng chuyển tiếp UDP, xem deploy/coturn/turnserver.conf
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ['coturn']
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-school.local}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        { [ -n "$$TURN_SHARED_SECRET" ] && [ -n "$$TURN_EXTERNAL_IP" ] || { echo "Cần đặt TURN_SHARED_SECRET và TURN_EXTERNAL_IP" >&2; exit 1; }; } &&
        exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SHARED_SECRET"
        --realm="$$TURN_REALM" --external-ip="$$TURN_EXTERNAL_IP"
    volumes:
      - ${COTURN_CONFIG:-./coturn/turnserver.conf}:/etc/coturn/turnserver.conf:ro
    logging: *logging

  # Lớp video trực tiếp (DT-27 phần 27a, YCTD-251): máy chủ phòng video LiveKit tự host và Egress ghi hình vào kho tệp S3; TURN dùng
  # chung coturn của 23e (bật thêm hồ sơ `coturn`). Tuỳ chọn: bật bằng COMPOSE_PROFILES=video và đặt VIDEO_PROVIDER=livekit,
  # LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_PUBLIC_URL, LIVEKIT_WEBHOOK_URL, TURN_HOST, TURN_SHARED_SECRET. Cấu hình ở
  # deploy/livekit/*.yaml, khoá thay vào lúc khởi động, không ghi vào tệp. Mở cổng TCP 7881 và dải UDP 50000 đến 50200 ở tường lửa;
  # địa chỉ wss của LIVEKIT_PUBLIC_URL do bộ chuyển tiếp (Caddy) chuyển về cổng 7880
  livekit:
    image: livekit/livekit-server:v1.13.7
    profiles: ['video']
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_WEBHOOK_URL: ${LIVEKIT_WEBHOOK_URL:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        { [ -n "$LIVEKIT_API_KEY" ] && [ -n "$LIVEKIT_API_SECRET" ] && [ -n "$LIVEKIT_WEBHOOK_URL" ] &&
        [ -n "$TURN_HOST" ] && [ -n "$TURN_SHARED_SECRET" ] ||
        { echo "Cần đặt LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_WEBHOOK_URL, TURN_HOST, TURN_SHARED_SECRET" >&2; exit 1; }; } &&
        sed -e "s|__LIVEKIT_API_KEY__|$$LIVEKIT_API_KEY|g" -e "s|__LIVEKIT_API_SECRET__|$$LIVEKIT_API_SECRET|g"
        -e "s|__LIVEKIT_WEBHOOK_URL__|$$LIVEKIT_WEBHOOK_URL|g" -e "s|__TURN_HOST__|$$TURN_HOST|g"
        -e "s|__TURN_SHARED_SECRET__|$$TURN_SHARED_SECRET|g" -e "s|__REDIS_PASSWORD__|$$REDIS_PASSWORD|g"
        /etc/livekit/livekit.yaml > /tmp/livekit.yaml && exec /livekit-server --config /tmp/livekit.yaml
    ports:
      - '127.0.0.1:7880:7880'
      - '7881:7881'
      - '50000-50200:50000-50200/udp'
    volumes:
      - ${LIVEKIT_CONFIG_DIR:-./livekit}:/etc/livekit:ro
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  egress:
    image: livekit/egress:v1.14.1
    profiles: ['video']
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed -e "s|__LIVEKIT_API_KEY__|$$LIVEKIT_API_KEY|g" -e "s|__LIVEKIT_API_SECRET__|$$LIVEKIT_API_SECRET|g"
        -e "s|__REDIS_PASSWORD__|$$REDIS_PASSWORD|g" /etc/livekit/egress.yaml > /tmp/egress.yaml &&
        EGRESS_CONFIG_FILE=/tmp/egress.yaml exec egress
    cap_add:
      - SYS_ADMIN
    volumes:
      - ${LIVEKIT_CONFIG_DIR:-./livekit}:/etc/livekit:ro
    depends_on:
      - livekit
    logging: *logging

  # Chạy tệp thay đổi cấu trúc cho cơ sở dữ liệu định danh, hệ thống và năm học đang dùng rồi dừng; dịch vụ định danh và
  # máy chủ API chỉ khởi động khi bước này thành công
  migrate:
    image: ${IMAGE_PREFIX:-school-management}/identity:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
      target: identity
    restart: 'no'
    working_dir: /app/database
    command: ['node', 'dist/src/migrate-command.js']
    environment:
      TZ: Asia/Ho_Chi_Minh
      IDENTITY_DATABASE_URL: postgres://identity_service:${IDENTITY_DATABASE_PASSWORD}@postgres:5432/school_identity
      SYSTEM_DATABASE_URL: postgres://api_service:${API_DATABASE_PASSWORD}@postgres:5432/school_system
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  identity:
    image: ${IMAGE_PREFIX:-school-management}/identity:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
      target: identity
    restart: unless-stopped
    environment:
      <<: *node-environment
      IDENTITY_PORT: 3001
      IDENTITY_DATABASE_URL: postgres://identity_service:${IDENTITY_DATABASE_PASSWORD}@postgres:5432/school_identity
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      IDENTITY_TOKEN_PRIVATE_KEY: ${IDENTITY_TOKEN_PRIVATE_KEY:?Thiếu IDENTITY_TOKEN_PRIVATE_KEY}
      API_BASE_URL: http://api:3000
      LOGIN_REQUESTS_PER_MINUTE: ${LOGIN_REQUESTS_PER_MINUTE:-10}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      ESMS_BRANDNAME: ${ESMS_BRANDNAME:-}
      ESMS_SANDBOX: ${ESMS_SANDBOX:-}
      ESMS_UNICODE: ${ESMS_UNICODE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-school-management}/api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
      target: api
    restart: unless-stopped
    environment: &api-environment
      <<: *node-environment
      API_PORT: 3000
      IDENTITY_BASE_URL: http://identity:3001
      SYSTEM_DATABASE_URL: postgres://api_service:${API_DATABASE_PASSWORD}@postgres:5432/school_system
      SCHOOL_YEAR_DATABASE_PREFIX: school_year_
      CHILD_DATA_ENCRYPTION_KEY: ${CHILD_DATA_ENCRYPTION_KEY:?Thiếu CHILD_DATA_ENCRYPTION_KEY}
      CHILD_DATA_HASH_KEY: ${CHILD_DATA_HASH_KEY:?Thiếu CHILD_DATA_HASH_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-school-files}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Thiếu S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Thiếu S3_SECRET_ACCESS_KEY}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      CASSO_WEBHOOK_SECRET: ${CASSO_WEBHOOK_SECRET:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-}
      NOTIFICATION_DISPATCH_INTERVAL_SECONDS: ${NOTIFICATION_DISPATCH_INTERVAL_SECONDS:-60}
      FACEBOOK_PUBLISHER: ${FACEBOOK_PUBLISHER:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      ZALO_SENDER: ${ZALO_SENDER:-}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v21.0}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_OA_REFRESH_TOKEN: ${ZALO_OA_REFRESH_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      ESMS_BRANDNAME: ${ESMS_BRANDNAME:-}
      ESMS_SANDBOX: ${ESMS_SANDBOX:-}
      ESMS_UNICODE: ${ESMS_UNICODE:-}
      # Hàng đợi máy xếp thời khoá biểu (DT-20 phần 22c2)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Giám thị camera cho thi trực tuyến (DT-23 phần 23e): máy chủ ICE cấp cho trình duyệt; trống thì chỉ kết nối trực tiếp
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-14400}
      # Lớp video trực tiếp (DT-27 phần 27a): trống là tắt video; livekit cần LIVEKIT_URL nội bộ, khoá và địa chỉ wss công khai
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
        required: false
    logging: *logging

  # Tiến trình chạy nền: máy xếp thời khoá biểu (DT-20 phần 22c2). Chỉ nối Redis; máy chủ API đẩy việc và đọc kết quả
  worker:
    image: ${IMAGE_PREFIX:-school-management}/worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *logging

  # Bản trình diễn (DT-18 phần 18h, YCTD-145): chỉ chạy khi bật hồ sơ `demo` (COMPOSE_PROFILES=seaweedfs,demo) trên máy chủ
  # trình diễn riêng. Lần đầu tạo dữ liệu giả, sau đó tự đặt lại mỗi DEMO_RESET_INTERVAL_HOURS giờ. Lệnh từ chối chạy trên
  # cơ sở dữ liệu đã có dữ liệu thật; không bật hồ sơ này ở máy chủ của trường
  demo-reset:
    image: ${IMAGE_PREFIX:-school-management}/api:${IMAGE_TAG:-latest}
    profiles: ['demo']
    restart: unless-stopped
    command:
      [
        'node',
        'dist/demo/demo-command.js',
        'schedule',
        '--confirm',
        '--interval-hours',
        '${DEMO_RESET_INTERVAL_HOURS:-24}',
      ]
    environment:
      <<: *api-environment
      IDENTITY_DATABASE_URL: postgres://identity_service:${IDENTITY_DATABASE_PASSWORD}@postgres:5432/school_identity
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Caddy: phục vụ ba giao diện, chuyển /api/v1 sang hai dịch vụ, tự cấp và gia hạn chứng chỉ HTTPS
  web:
    image: ${IMAGE_PREFIX:-school-management}/web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Thiếu ACME_EMAIL}
      PORTAL_SITE: ${PORTAL_SITE:?Thiếu PORTAL_SITE}
      PARENT_SITE: ${PARENT_SITE:?Thiếu PARENT_SITE}
      TEACHER_SITE: ${TEACHER_SITE:?Thiếu TEACHER_SITE}
      API_SITE: ${API_SITE:?Thiếu API_SITE}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      identity:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
