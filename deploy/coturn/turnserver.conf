# Máy chủ chuyển tiếp WebRTC coturn (DT-23 phần 23e, YCTD-215; dùng chung về sau cho 27a).
# Khoá dùng chung (--static-auth-secret), vùng (--realm) và địa chỉ công khai (--external-ip) truyền qua dòng lệnh từ biến môi trường
# TURN_SHARED_SECRET, TURN_REALM, TURN_EXTERNAL_IP của docker-compose; tệp này chỉ giữ phần không bí mật.

# Cổng nghe: UDP và TCP 3478; dải cổng chuyển tiếp UDP phải mở ở tường lửa
listening-port=3478
min-port=49160
max-port=49200

# Xác thực bằng tên đăng nhập có hạn do máy chủ API cấp (TURN REST API): "<hết hạn>:<người dùng>" và mật khẩu là HMAC-SHA1 của nó
use-auth-secret
fingerprint
lt-cred-mech

# Không nhận kết nối không xác thực, không bật giao diện quản trị, chỉ dùng giao thức hiện hành
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
no-stdout-log
log-file=stdout
simple-log

# Chỉ chuyển tiếp tới địa chỉ công khai: chặn dùng máy chủ này để chạm vào mạng nội bộ của máy chủ (chống lạm dụng chuyển tiếp)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Giới hạn phiên chuyển tiếp để một máy không chiếm hết băng thông (giá trị gợi ý, chỉnh theo máy chủ)
total-quota=300
user-quota=20
