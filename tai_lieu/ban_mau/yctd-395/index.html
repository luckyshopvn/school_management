<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản mẫu YCTD-395: ứng dụng giáo viên trên máy tính</title>
<!-- Bản mẫu YCTD-395: bố cục máy tính (từ 1024 điểm ảnh) cho ứng dụng giáo viên; điện thoại giữ như hiện nay. Khung theo
     KC-09, TD-21 của tài liệu 15 (YCTD-384 đã duyệt): thanh bên trắng 240 điểm ảnh từ 1024. Dữ liệu giả.
     Mở thẳng tệp bằng trình duyệt. Thanh trên cùng chọn màn hình, khổ, trạng thái, màu khung; khung dùng container query
     nên cùng một trang hiện đúng bố cục máy tính 1366, máy tính 1024, điện thoại 390 điểm ảnh. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Biến: màu hiện tại của ứng dụng giáo viên (packages/ui/theme.css, apps/teacher/src/index.css) ===== */
  .ung-dung {
    --font: 'Be Vietnam Pro', system-ui, sans-serif;
    --page: #f5f7fa; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --input-border: #cbd5e1; --line: #eef1f4;
    --accent: #0670c0; --accent-strong: #055a9a; --accent-soft: #e6f2fc; --link: #0369a1;
    --success-bg: #e3f4ea; --success: #15803d; --warning-bg: #fdf0d8; --warning: #92400e; --danger-bg: #fdecec; --danger: #b91c1c;
    --info-bg: #e8eef7; --info: #1d4ed8; --neutral-bg: #eef1f4; --neutral: #475569;
    --touch: 44px;
  }
  /* Phương án màu khung theo vai giáo viên đã duyệt ở YCTD-384 (PC-15 đến PC-21) */
  .ung-dung.mau-theo-vai { --page: #fbf8f3; --text: #1f2a24; --muted: #5c6660; --border: #e7e1d8; --line: #f1ece4; --input-border: #8a8174;
    --accent: #0f6b5f; --accent-strong: #0b564c; --accent-soft: #e1f1ec; --link: #0b564c; }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #d9dee5; color: #0f172a; }
  /* ===== Thanh chọn của bản mẫu (không thuộc thiết kế) ===== */
  .bm-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 10px 16px; background: #fff; border-bottom: 1px solid #c9d0d9; font-size: 14px; }
  .bm-bar label { display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
  .bm-bar select { height: 40px; font: 15px inherit; font-family: inherit; padding: 0 8px; border: 1px solid #7d8896; border-radius: 6px; }
  .bm-note { flex-basis: 100%; color: #4a5562; margin: 0; }
  .bm-stage { padding: 24px 16px 48px; display: flex; justify-content: center; }
  .bm-frame { container-type: inline-size; container-name: khung; background: #fff; box-shadow: 0 4px 24px rgb(0 0 0 / 18%); overflow: hidden; position: relative; }
  .bm-frame[data-kho="390"] { border-radius: 28px; border: 8px solid #1d232b; }

  /* ===== Thành phần chung (giống packages/ui hiện có) ===== */
  .ung-dung { font-family: var(--font); color: var(--text); background: var(--page); font-size: 15px; line-height: 1.5; min-height: 820px; }
  .btn { min-height: var(--touch); padding: 0 16px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--card); color: var(--text); font: 500 14px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-align: center; }
  .btn.chinh { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.chinh:hover { background: var(--accent-strong); }
  .btn.chu { border-color: transparent; background: transparent; color: var(--link); padding: 0 8px; }
  .btn[disabled] { opacity: .6; cursor: not-allowed; }
  .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .badge.tc { background: var(--success-bg); color: var(--success); } .badge.nh { background: var(--danger-bg); color: var(--danger); }
  .badge.trung { background: var(--neutral-bg); color: var(--neutral); } .badge.tt { background: var(--info-bg); color: var(--info); }
  .dai { padding: 12px 16px; border-radius: 8px; font-size: 15px; }
  .dai.tt { background: var(--info-bg); color: var(--info); } .dai.nh { background: var(--danger-bg); color: var(--danger); }
  .dai.tc { background: var(--success-bg); color: var(--success); } .dai.cb { background: var(--warning-bg); color: var(--warning); }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500; }
  .field input, .field select, .field textarea { min-height: var(--touch); font: 16px var(--font); color: var(--text); padding: 0 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--card); width: 100%; }
  .field textarea { padding: 8px 12px; min-height: 88px; }
  .field.loi select, .field.loi input { border: 2px solid var(--danger); }
  .thong-bao-loi { color: var(--danger); font-size: 14px; font-weight: 500; }
  .muted { color: var(--muted); font-size: 14px; }
  .xuong { background: linear-gradient(90deg, var(--line) 0%, #e3e8ee 50%, var(--line) 100%); background-size: 200% 100%; animation: xuong 1.4s infinite; border-radius: 8px; }
  @keyframes xuong { to { background-position: -200% 0; } }
  .thong-bao-noi { position: absolute; top: 16px; right: 16px; z-index: 30; max-width: min(380px, calc(100% - 32px)); padding: 12px 14px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--success); border-radius: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / 14%); }
  h1, h2, h3 { margin: 0; }
  h1 { font-size: 24px; line-height: 1.3; } h2 { font-size: 18px; font-weight: 600; }

  /* ===== Điện thoại: giữ như hiện nay (thanh tiêu đề trắng, một cột, nút xếp dọc) ===== */
  .dt-dau { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; font-size: 18px; font-weight: 600; color: #0f172a; }
  .dt-than { max-width: 448px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  .dt-than .btn { width: 100%; }
  .dt-lop { display: flex; flex-direction: column; gap: 4px; }
  .dt-lop .ten { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border); background: var(--card); border-radius: 12px; }

  /* ===== Máy tính: khung có thanh bên (TD-21, KC-09) ===== */
  .mt { display: none; }
  @container khung (min-width: 1024px) {
    .dt { display: none; }
    .mt { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 820px; }
  }
  .ben { background: var(--card); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; align-self: start; max-height: 860px; overflow-y: auto; }
  .ben .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
  .ben .logo i { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-style: normal; font-weight: 700; flex: none; }
  .ben .logo b { display: block; font-size: 15px; line-height: 1.25; }
  .ben .logo small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
  .ben a { display: flex; align-items: center; gap: 10px; min-height: var(--touch); padding: 0 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 15px; }
  .ben a:hover { background: var(--page); }
  .ben a[aria-current] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
  .ben a .dem { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--danger); color: #fff; font-size: 14px; font-weight: 700; display: inline-grid; place-items: center; }
  .ben svg { width: 20px; height: 20px; flex: none; }
  .ben .nhom { margin: 12px 12px 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .ben .chon-lop { margin: 4px 0 2px; }
  .ben .chon-lop select { width: 100%; min-height: var(--touch); font: 600 15px var(--font); color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 999px; padding: 0 12px; }
  .ben .ke { border-top: 1px solid var(--border); margin: 10px 0; }
  .ben .chan { margin-top: auto; padding-top: 12px; }
  .mt-chinh { min-width: 0; display: flex; flex-direction: column; }
  .mt-dau { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--border); }
  .mt-dau .duong { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt-dau .duong b { color: var(--text); }
  .chuong { position: relative; }
  .chuong .so { position: absolute; top: 2px; right: 2px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  .anh { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; display: grid; place-items: center; flex: none; }
  .mt-noi-dung { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; max-width: 1200px; width: 100%; }
  .tieu-de { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tieu-de h1 { flex: 1; min-width: 220px; }

  /* Trang chủ */
  .nha-luoi { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  @container khung (min-width: 1280px) { .nha-luoi { grid-template-columns: minmax(0, 1fr) 340px; } }
  .loi-chao { background: var(--accent); color: #fff; border-radius: 16px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .loi-chao b { font-size: 20px; display: block; } .loi-chao small { opacity: .92; font-size: 14px; }
  .lop-luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .the-lop { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .the-lop .dau { display: flex; gap: 12px; align-items: flex-start; }
  .the-lop .dau .ten { flex: 1; min-width: 0; }
  .the-lop .dau .ten b { font-size: 17px; display: block; overflow-wrap: anywhere; }
  .the-lop .nut { display: flex; flex-wrap: wrap; gap: 8px; }
  .the-lop .nut .btn { flex: 1 1 calc(33% - 8px); min-width: 120px; padding: 0 10px; }
  .loi-tat { display: flex; flex-wrap: wrap; gap: 8px; }
  .ben-phai { display: flex; flex-direction: column; gap: 16px; }
  .the-tieu-de { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; }
  .dong { display: flex; gap: 12px; align-items: flex-start; padding: 10px 16px; border-top: 1px solid var(--line); }
  .dong .noi { flex: 1; min-width: 0; } .dong .noi small { display: block; color: var(--muted); font-size: 14px; }

  /* Bảng */
  .bang-cuon { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--card); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.ten b { font-weight: 600; } td.ten small { display: block; color: var(--muted); font-size: 14px; }
  tr.thu-hoi td { color: var(--muted); }
  .chi-so { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 520px; }
  .chi-so .card { padding: 16px; } .chi-so .gia-tri { font-size: 28px; font-weight: 700; display: block; line-height: 1.2; }
  /* Sổ điểm: bảng nhập theo ô, cột họ tên và hàng tiêu đề dính (TD-29) */
  .ma-tran { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .ma-tran table { border-collapse: separate; border-spacing: 0; }
  .ma-tran th, .ma-tran td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 4px 6px; text-align: center; background: var(--card); }
  .ma-tran thead th { position: sticky; top: 0; z-index: 2; background: var(--page); color: var(--text); }
  .ma-tran .dinh { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 240px; box-shadow: 2px 0 0 var(--border); padding-left: 12px; }
  .ma-tran thead .dinh { z-index: 3; }
  .ma-tran input, .ma-tran select { width: 64px; min-height: var(--touch); font: 16px var(--font); text-align: center; border: 1px solid var(--input-border); border-radius: 6px; background: #fff; }
  .ma-tran select { width: 140px; }
  .ma-tran input.loi { border: 2px solid var(--danger); }
  .ma-tran td.tb { font-weight: 700; }
  .loc { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .loc .field { min-width: 200px; }
  /* Ghi nhận: hai cột, thanh lưu dính đáy */
  .ghi-luoi { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  @container khung (min-width: 1280px) { .ghi-luoi { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .khoi { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .chon-nhom { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .chon-nhom .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hs-dong { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 8px; border-radius: 8px; }
  .hs-dong input { width: 20px; height: 20px; }
  .chan-luu { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 24px; background: var(--card); border-top: 1px solid var(--border); margin: 0 -24px -32px; }
  .chan-luu .muted { margin-right: auto; }
  .khoi-rong { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .khoi-rong .minh-hoa { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; }
  .khoi-rong p { margin: 0; color: var(--muted); max-width: 440px; }
</style>
</head>
<body>
<div class="bm-bar" role="region" aria-label="Chọn màn hình của bản mẫu">
  <label>Màn hình <select id="chon-man">
    <option value="nha">MG-01 Trang chủ (Lớp của tôi)</option>
    <option value="ca-truc">MH-676 Ca trực hôm nay</option>
    <option value="ghi-nhan">MH-676 Ghi nhận vi phạm, khen</option>
    <option value="so-diem">MH-275 Sổ điểm lớp</option>
  </select></label>
  <label>Khổ <select id="chon-kho"><option value="1366">Máy tính 1366</option><option value="1024">Máy tính 1024</option><option value="390">Điện thoại 390 (giữ như hiện nay)</option></select></label>
  <label>Trạng thái <select id="chon-tt">
    <option value="du-lieu">Có dữ liệu</option><option value="rong">Rỗng</option><option value="dang-tai">Đang tải</option>
    <option value="loi">Lỗi</option><option value="khong-quyen">Không có quyền</option><option value="thanh-cong">Thông báo thành công</option>
  </select></label>
  <label>Màu khung <select id="chon-mau"><option value="hien-tai">Màu hiện tại của ứng dụng (đề xuất)</option><option value="theo-vai">Màu theo vai giáo viên (YCTD-384 L7)</option></select></label>
  <p class="bm-note">Từ 1024 điểm ảnh: thanh bên trắng 240 điểm ảnh, nội dung rộng tối đa 1200 điểm ảnh. Dưới 1024 (máy tính bảng dọc, điện thoại): giữ y như hiện nay. Bấm mục trên thanh bên để chuyển màn hình.</p>
</div>
<div class="bm-stage"><div class="bm-frame" id="khung"></div></div>

<script>
const ICON = {
  nha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  muc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg>',
  chuong: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  rong: '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h7"/></svg>',
};
// Dữ liệu giả, có tên dài để kiểm tràn chữ
const LOP = [
  { ten: '6A', cap: 'THCS', si: 38, cn: true, nut: ['Điểm danh', 'Sổ điểm', 'Trao đổi và đồ bị mất', 'Hoạt động và hình ảnh', 'Giảng dạy'] },
  { ten: '7B', cap: 'THCS', si: 41, cn: false, nut: ['Sổ điểm', 'Trao đổi và đồ bị mất', 'Hoạt động và hình ảnh', 'Giảng dạy'] },
  { ten: '10A1 Chuyên Toán – Tin học chất lượng cao', cap: 'THPT', si: 35, cn: false, nut: ['Sổ điểm', 'Trao đổi và đồ bị mất', 'Hoạt động và hình ảnh', 'Giảng dạy'] },
];
const GHI = [
  ['07:12', 'Nguyễn Hoàng Bảo Ngọc', '6A', 'nh', 'Vi phạm', 'Đi học muộn sau hồi trống thứ hai', 'Cổng chính', 'hien'],
  ['09:35', 'Trần Thị Minh Khuê', '7B', 'tc', 'Khen', 'Nhặt được của rơi trả lại người mất', 'Sân trường', 'hien'],

];
const DIEM = [
  ['Đặng Quốc Anh', ['8', '7.5', '9', ''], '7.8', '', '8.1'],
  ['Hoàng Thị Thu Hà', ['9', '9.5', '10', '9'], '9.0', '9.5', '9.3'],
  ['Nguyễn Hoàng Bảo Ngọc', ['6', '7', '', ''], '6.5', '', ''],
  ['Phan Lê Minh Châu Trần Khánh Linh', ['10', '9', '9', '10'], '9.5', '9.8', '9.6'],
  ['Võ Đức Thắng', ['5', '11', '', ''], '', '', ''],
];
const NAV = [
  { nhom: null, muc: [['nha', 'Trang chủ', 'nha']] },
  { nhom: 'Lớp đang chọn', chonLop: true, muc: [['so-diem', 'Sổ điểm'], [null, 'Điểm danh'], [null, 'Trao đổi và đồ bị mất'], [null, 'Hoạt động và hình ảnh'], [null, 'Giảng dạy']] },
  { nhom: 'Giảng dạy', muc: [[null, 'Lịch dạy của tôi'], [null, 'Sổ đầu bài'], [null, 'Hộp công cụ giảng dạy'], [null, 'Chế độ lớp học'], [null, 'Lớp học trực tuyến']] },
  { nhom: 'Rèn luyện', muc: [['ca-truc', 'Ghi nhận rèn luyện'], [null, 'Gia sư AI: cờ cần xử lý', null, 2]] },
  { nhom: 'Cá nhân', muc: [[null, 'Chấm công và nghỉ phép'], [null, 'Phiếu lương'], [null, 'Công việc của tôi'], [null, 'Bồi dưỡng của tôi'], [null, 'Sách tôi đang mượn']] },
  { nhom: 'Cổng trường', muc: [[null, 'Xác nhận người đón tại cổng'], [null, 'Quét thẻ vào, ra cổng'], [null, 'Kiểm kê thiết bị']] },
];

  return `<div class="dt-than" style="max-width:768px;padding:16px"><div><button class="btn chu" style="width:auto" data-man="nha">Quay lại</button></div>
    <div class="loc"><label class="field"><span>Học kỳ</span><select><option>Học kỳ I</option></select></label><label class="field"><span>Môn học</span><select><option>Toán</option></select></label></div>
    ${DIEM.slice(0, 3).map(([ten, tx, gk, ck, tb]) => `<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px"><b>${ten}${tb ? ' · TB ' + tb : ''}</b><div style="display:flex;flex-wrap:wrap;gap:8px">${tx.map((v, i) => `<input style="width:64px;min-height:44px;font-size:16px;border:1px solid var(--input-border);border-radius:8px;padding:0 6px" placeholder="TX${i + 1}" value="${v}">`).join('')}</div></div>`).join('')}
    <button class="btn chinh">Lưu điểm</button></div>`;
}

const MAN = { nha: [nhaMayTinh, nhaDienThoai], 'ca-truc': [caTrucMayTinh, caTrucDienThoai], 'ghi-nhan': [ghiNhanMayTinh, ghiNhanDienThoai], 'so-diem': [soDiemMayTinh, soDiemDienThoai] };

function ve() {
  const khung = document.getElementById('khung');
  khung.dataset.kho = s.kho;
  khung.style.width = `${s.kho}px`;
  const [mayTinh, dienThoai] = MAN[s.man];
  khung.innerHTML = `<div class="ung-dung ${s.mau === 'theo-vai' ? 'mau-theo-vai' : ''}">
    <div class="mt">${thanhBen()}<div class="mt-chinh">${dauTrang()}<main class="mt-noi-dung" style="position:relative">${mayTinh()}</main></div></div>
    <div class="dt">${dienThoai()}</div></div>`;
  khung.querySelectorAll('[data-man]').forEach((el) => el.addEventListener('click', (event) => {
    event.preventDefault();
    if (!el.dataset.man) return;
    s.man = el.dataset.man;
    document.getElementById('chon-man').value = s.man;
    ve();
  }));
}
for (const [id, khoa] of [['chon-man', 'man'], ['chon-kho', 'kho'], ['chon-tt', 'tt'], ['chon-mau', 'mau']]) {
  document.getElementById(id).addEventListener('change', (event) => { s[khoa] = event.target.value; ve(); });
}
ve();
</script>
</body>
</html>
