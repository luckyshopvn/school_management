<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản mẫu điểm danh bằng camera và thẻ</title>
<style>
/* Giá trị lấy từ tài liệu 15 (M-01, N-01, C-01, T-01...). Dữ liệu giả, không có ảnh người thật. */
:root {
  --mau-chinh: #0670C0; --mau-chinh-dam: #055A9A; --lien-ket: #0369A1;
  --nen-trang: #F5F7FA; --nen-the: #FFFFFF; --nen-chon: #E6F2FC;
  --chu-chinh: #0F172A; --chu-phu: #475569; --chu-mo: #64748B;
  --vien: #E2E8F0; --vien-nhan: #CBD5E1;
  --thanh-cong: #166534; --canh-bao: #92400E; --nguy-hiem: #B91C1C; --thong-tin: #1D4ED8; --trung-tinh: #475569;
  --nen-thanh-cong: #DCFCE7; --nen-canh-bao: #FEF3C7; --nen-nguy-hiem: #FEE2E2; --nen-thong-tin: #DBEAFE; --nen-trung-tinh: #F1F5F9;
  --bo-goc: 8px; --bo-goc-lon: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #E9EDF2; color: var(--chu-chinh);
  font: 15px/1.5 system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, select, input { font: inherit; }
:focus-visible { outline: 3px solid var(--lien-ket); outline-offset: 2px; }

.dieu-khien { position: sticky; top: 0; z-index: 10; background: #0F172A; color: #fff; padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.dieu-khien strong { font-size: 15px; }
.dieu-khien label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.dieu-khien select { padding: 6px 8px; border-radius: 6px; border: 0; min-height: 36px; }
.ghi-chu-ban-mau { padding: 8px 16px; font-size: 14px; color: var(--chu-phu); background: #fff; border-bottom: 1px solid var(--vien); }

.san-khau { padding: 20px 16px 60px; display: flex; justify-content: center; }
.khung { container-type: inline-size; background: var(--nen-trang); border: 1px solid var(--vien-nhan); border-radius: 14px;
  overflow: hidden; width: 1366px; max-width: 100%; min-height: 760px; box-shadow: 0 6px 24px rgba(15,23,42,.12); }
.khung.may-tinh-bang { width: 1024px; }
.khung.dien-thoai { width: 390px; }

/* Thanh đầu ứng dụng */
.dau-trang { background: var(--mau-chinh); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.dau-trang .ten { font-weight: 700; color: #FFFF00; }
.dau-trang .vi-tri { font-size: 14px; opacity: .95; }
.dau-trang .nguoi { margin-left: auto; font-size: 14px; }
@container (max-width: 600px) { .dau-trang .vi-tri, .dau-trang .nguoi { display: none; } }

.noi-dung { padding: 20px; }
@container (max-width: 600px) { .noi-dung { padding: 12px; } }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 16px; margin: 0 0 8px; }
.mo-ta { color: var(--chu-phu); margin: 0 0 16px; }

.the { background: var(--nen-the); border: 1px solid var(--vien); border-radius: var(--bo-goc-lon); padding: 16px; margin-bottom: 16px; }
.hang { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.gian { justify-content: space-between; }

.nut { min-height: 44px; padding: 8px 16px; border-radius: var(--bo-goc); border: 1px solid var(--vien-nhan); background: #fff;
  color: var(--chu-chinh); cursor: pointer; }
.nut:hover { border-color: var(--chu-mo); }
.nut.chinh { background: var(--mau-chinh); border-color: var(--mau-chinh); color: #fff; }
.nut.chinh:hover { background: var(--mau-chinh-dam); }
.nut.nguy-hiem { color: var(--nguy-hiem); border-color: #FCA5A5; }
.nut.nho { min-height: 36px; padding: 4px 10px; font-size: 14px; }
.nut[disabled] { opacity: .6; cursor: not-allowed; }
@container (max-width: 600px) { .nut { min-height: 44px; } .nut.nho { min-height: 44px; } }

.nhan { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.nhan.tc { background: var(--nen-thanh-cong); color: var(--thanh-cong); }
.nhan.cb { background: var(--nen-canh-bao); color: var(--canh-bao); }
.nhan.ng { background: var(--nen-nguy-hiem); color: var(--nguy-hiem); }
.nhan.tt { background: var(--nen-thong-tin); color: var(--thong-tin); }
.nhan.tr { background: var(--nen-trung-tinh); color: var(--trung-tinh); }

.dai-bao { border-radius: var(--bo-goc); padding: 10px 14px; margin-bottom: 16px; border: 1px solid; }
.dai-bao.tt { background: var(--nen-thong-tin); border-color: #93C5FD; color: #1E3A8A; }
.dai-bao.cb { background: var(--nen-canh-bao); border-color: #FCD34D; color: #78350F; }
.dai-bao.ng { background: var(--nen-nguy-hiem); border-color: #FCA5A5; color: #7F1D1D; }
.dai-bao.tc { background: var(--nen-thanh-cong); border-color: #86EFAC; color: #14532D; }

.tong-hop { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
@container (max-width: 1100px) { .tong-hop { grid-template-columns: repeat(3, 1fr); } }
@container (max-width: 600px) { .tong-hop { grid-template-columns: repeat(2, 1fr); } }
.o-so { background: #fff; border: 1px solid var(--vien); border-radius: var(--bo-goc); padding: 10px 12px; }
.o-so b { display: block; font-size: 22px; }
.o-so span { color: var(--chu-phu); font-size: 14px; }

.bang-boc { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--vien); vertical-align: top; }
th { font-size: 14px; color: var(--chu-phu); font-weight: 600; background: #F8FAFC; white-space: nowrap; }
tr.dang-chon td { background: var(--nen-chon); }
.chu-phu { color: var(--chu-phu); font-size: 14px; }
.hoc-sinh { display: flex; gap: 10px; align-items: center; min-width: 0; }
.chu-cai { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #E2E8F0; color: var(--chu-phu);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.ten-dai { overflow-wrap: anywhere; }
select.o-chon, input.o-nhap { min-height: 40px; padding: 6px 8px; border: 1px solid var(--vien-nhan); border-radius: 6px; background: #fff; }
input.o-nhap.loi { border-color: var(--nguy-hiem); }
.loi-o { color: var(--nguy-hiem); font-size: 14px; margin-top: 4px; }

/* Bảng chuyển thành thẻ trên điện thoại */
.danh-sach-the { display: none; }
@container (max-width: 600px) {
  .chi-may-tinh { display: none; }
  .danh-sach-the { display: block; }
}
.the-hs { background: #fff; border: 1px solid var(--vien); border-radius: var(--bo-goc-lon); padding: 12px; margin-bottom: 10px; }
.the-hs .hang + .hang { margin-top: 8px; }

.chan-trang { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--vien); padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@container (max-width: 600px) { .chan-trang { padding: 10px 12px; } .chan-trang .nut { flex: 1; } }

.luoi-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.luoi-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@container (max-width: 1100px) { .luoi-4 { grid-template-columns: 1fr 1fr; } }
@container (max-width: 800px) { .luoi-2 { grid-template-columns: 1fr; } }
@container (max-width: 600px) { .luoi-4 { grid-template-columns: 1fr; } }

.lua-chon { display: block; border: 2px solid var(--vien); border-radius: var(--bo-goc-lon); padding: 12px; background: #fff; cursor: pointer; }
.lua-chon.da-chon { border-color: var(--mau-chinh); background: var(--nen-chon); }
.lua-chon.khoa { background: #F8FAFC; cursor: not-allowed; }
.lua-chon input { margin-right: 6px; }

.truong { margin-bottom: 12px; }
.truong label { display: block; font-weight: 600; margin-bottom: 4px; }
.goi-y { color: var(--chu-phu); font-size: 14px; }

.cong-tac { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--vien); }
.cong-tac:last-child { border-bottom: 0; }
.cong-tac input { width: 22px; height: 22px; flex: none; }

/* Hộp xem ảnh cần xem và hộp xác nhận */
.lop-phu { position: absolute; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
.lop-phu.mo { display: flex; }
.hop { background: #fff; border-radius: var(--bo-goc-lon); padding: 20px; width: 520px; max-width: 100%; }
.anh-gia { height: 180px; border-radius: var(--bo-goc); background: repeating-linear-gradient(45deg, #E2E8F0 0 10px, #F1F5F9 10px 20px);
  display: grid; place-items: center; color: var(--chu-phu); text-align: center; padding: 12px; font-size: 14px; }
.khung-ung-dung { position: relative; }

.dong-thoi-gian { list-style: none; margin: 0; padding: 0; }
.dong-thoi-gian li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--vien); }
.dong-thoi-gian .gio { flex: none; width: 56px; font-weight: 700; }
.thong-bao-day { background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(15,23,42,.15); padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--vien); }
.thong-bao-day .ung-dung { font-size: 14px; color: var(--chu-phu); }

.xuong { background: linear-gradient(90deg, #E2E8F0, #F1F5F9, #E2E8F0); background-size: 200% 100%; animation: chay 1.2s infinite; border-radius: 6px; height: 16px; margin: 10px 0; }
@keyframes chay { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .xuong { animation: none; } }
.trang-thai-chung { text-align: center; padding: 48px 16px; }
.trang-thai-chung p { color: var(--chu-phu); max-width: 520px; margin: 8px auto 16px; }

.thanh-tab { display: flex; gap: 4px; border-bottom: 1px solid var(--vien); margin-bottom: 16px; overflow-x: auto; }
.thanh-tab button { border: 0; background: none; padding: 10px 14px; min-height: 44px; cursor: pointer; color: var(--chu-phu); border-bottom: 3px solid transparent; white-space: nowrap; }
.thanh-tab button[aria-selected="true"] { color: var(--mau-chinh-dam); border-bottom-color: var(--mau-chinh-dam); font-weight: 600; }
.an { display: none !important; }
.toast { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); background: #0F172A; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; max-width: 90%; }
.toast.mo { display: block; }
</style>
</head>
<body>
<div class="dieu-khien" role="region" aria-label="Điều khiển bản mẫu">
  <strong>Bản mẫu: điểm danh bằng camera và thẻ</strong>
  <label>Màn hình
    <select id="chon-man-hinh">
      <option value="diem-danh">MH-640. Điểm danh có kết quả camera, thẻ</option>
      <option value="cau-hinh">MH-641. Cấu hình camera và thiết bị</option>
      <option value="dong-y">MH-642. Đồng ý của phụ huynh</option>
      <option value="thong-bao">MH-643. Thông báo đến và về</option>
    </select>
  </label>
  <label>Cỡ
    <select id="chon-co">
      <option value="">Máy tính (1366)</option>
      <option value="may-tinh-bang">Máy tính bảng (1024)</option>
      <option value="dien-thoai">Điện thoại (390)</option>
    </select>
  </label>
  <label>Trạng thái
    <select id="chon-trang-thai">
      <option value="du-lieu">Có dữ liệu</option>
      <option value="rong">Rỗng</option>
      <option value="dang-tai">Đang tải</option>
      <option value="loi">Lỗi</option>
      <option value="khong-quyen">Không có quyền</option>
    </select>
  </label>
</div>
<div class="ghi-chu-ban-mau" id="ghi-chu"></div>

<div class="san-khau">
  <div class="khung" id="khung">
    <div class="khung-ung-dung">
      <div class="dau-trang">
        <span class="ten" id="ten-ung-dung">Quản lý trường học</span>
        <span class="vi-tri" id="vi-tri">Trường Trung học cơ sở Trình Diễn</span>
        <span class="nguoi" id="nguoi-dung">Cô Trần Thị Thu Hà · Giáo viên chủ nhiệm</span>
      </div>
      <div id="vung-noi-dung"></div>
      <div class="lop-phu" id="lop-phu" role="dialog" aria-modal="true" aria-labelledby="tieu-de-hop"><div class="hop" id="hop"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<!-- ============ MÀN HÌNH 1: ĐIỂM DANH ============ -->
<template id="mh-diem-danh">
  <div class="noi-dung">
    <div class="hang gian">
      <div>
        <h1>Điểm danh lớp 7A</h1>
        <p class="mo-ta">Thứ Sáu, 30/10/2026 · Giờ vào lớp 07:15 · Sĩ số 36</p>
      </div>
      <div class="hang">
        <label class="chu-phu" for="ngay">Ngày</label>
        <input class="o-nhap" id="ngay" type="date" value="2026-10-30">
      </div>
    </div>
    <div class="dai-bao tt">Cột "Camera và thẻ" chỉ là gợi ý từ thiết bị ở cổng. Hệ thống không tự ghi vắng; riêng "Đi muộn" từ thẻ QR, thẻ RFID, máy chấm công được tự ghi, thầy cô sửa được. Thầy cô kiểm tra rồi bấm <b>Lưu điểm danh</b>; học sinh chưa thấy qua cổng để trống cho thầy cô chọn.</div>
    <div class="tong-hop">
      <div class="o-so"><b>29</b><span>Qua cổng, chắc chắn</span></div>
      <div class="o-so"><b>2</b><span>Cần xem lại</span></div>
      <div class="o-so"><b>1</b><span>Qua cổng sau giờ vào lớp</span></div>
      <div class="o-so"><b>2</b><span>Chưa thấy qua cổng</span></div>
      <div class="o-so"><b>2</b><span>Không dùng camera (thẻ hoặc điểm danh tay)</span></div>
    </div>

    <div class="the chi-may-tinh" style="padding:0">
      <div class="bang-boc">
        <table>
          <thead><tr><th>STT</th><th>Học sinh</th><th>Camera và thẻ</th><th>Trạng thái điểm danh</th><th>Ghi chú</th><th></th></tr></thead>
          <tbody id="than-bang"></tbody>
        </table>
      </div>
      <div class="chu-phu" style="padding:10px 12px">Đang hiện 7 trên 36 học sinh. <a href="#" style="color:var(--lien-ket)">Hiện tất cả</a></div>
    </div>
    <div class="danh-sach-the" id="danh-sach-the"></div>
  </div>
  <div class="chan-trang">
    <button class="nut" data-hanh-dong="xac-nhan-goi-y">Điền theo gợi ý (31 học sinh)</button>
    <button class="nut chinh" data-hanh-dong="luu">Lưu điểm danh</button>
  </div>
</template>

<!-- ============ MÀN HÌNH 2: CẤU HÌNH ============ -->
<template id="mh-cau-hinh">
  <div class="noi-dung">
    <h1>Điểm danh bằng thiết bị</h1>
    <p class="mo-ta">Cài đặt trường · Chỉ Hiệu trưởng và Quản lý đơn vị thay đổi được.</p>
    <div class="thanh-tab" role="tablist">
      <button role="tab" aria-selected="true" data-tab="phuong-an">Phương án</button>
      <button role="tab" aria-selected="false" data-tab="thiet-bi">Thiết bị</button>
      <button role="tab" aria-selected="false" data-tab="nguong">Ngưỡng và thời hạn</button>
      <button role="tab" aria-selected="false" data-tab="vung">Vùng cảnh báo nội quy</button>
    </div>

    <section data-ngan="phuong-an">
      <div class="luoi-4">
        <label class="lua-chon da-chon"><input type="checkbox" checked> <b>Thẻ QR</b><br><span class="goi-y">In thẻ từ danh sách học sinh. Bảo vệ quét bằng máy tính bảng. Không dùng sinh trắc học.</span></label>
        <label class="lua-chon"><input type="checkbox"> <b>Thẻ RFID</b><br><span class="goi-y">Chỉ đặt đầu đọc ở cổng. Cần đồng ý của phụ huynh (Điều 31 Luật 91/2025/QH15).</span></label>
        <label class="lua-chon da-chon"><input type="checkbox" checked> <b>Máy chấm công có sẵn</b><br><span class="goi-y">Nhận dữ liệu từ máy qua kết nối hoặc tệp. Dùng cho cán bộ; học sinh cần đồng ý.</span></label>
        <label class="lua-chon khoa"><input type="checkbox" disabled> <b>Camera nhận diện khuôn mặt</b><br><span class="goi-y">Đang khóa: cần tải lên bằng chứng đã nộp hồ sơ đánh giá tác động xử lý dữ liệu cá nhân.</span><br><button class="nut nho" style="margin-top:8px">Tải bằng chứng</button></label>
      </div>
      <div class="the" style="margin-top:16px">
        <h2>Áp dụng camera khuôn mặt cho</h2>
        <div class="hang">
          <label><input type="checkbox" checked disabled> Tiểu học (đăng ký lại mỗi học kỳ)</label>
          <label><input type="checkbox" checked disabled> Trung học cơ sở</label>
          <label><input type="checkbox" checked disabled> Trung học phổ thông</label>
          <label><input type="checkbox" checked disabled> Cán bộ, giáo viên</label>
        </div>
        <p class="goi-y" style="margin:8px 0 0">Mầm non không dùng nhận diện khuôn mặt; dùng luồng bàn giao khi đón trẻ.</p>
      </div>
      <div class="the">
        <h2>Biển thông báo có camera</h2>
        <p class="mo-ta">Đặt ở cổng và nơi có camera. Nội dung ghi mục đích, thời hạn lưu, đầu mối liên hệ.</p>
        <button class="nut">Tải biển thông báo (PDF, khổ A3)</button>
      </div>
    </section>

    <section data-ngan="thiet-bi" class="an">
      <div class="hang gian" style="margin-bottom:12px">
        <h2 style="margin:0">Thiết bị (5)</h2>
        <div class="hang"><button class="nut">Nhập tệp máy chấm công</button><button class="nut chinh" data-hanh-dong="them-thiet-bi">Thêm thiết bị</button></div>
      </div>
      <div class="the chi-may-tinh" style="padding:0"><div class="bang-boc"><table>
        <thead><tr><th>Tên</th><th>Loại</th><th>Vị trí, hướng</th><th>Tình trạng</th><th>Lần cuối gửi</th><th></th></tr></thead>
        <tbody>
          <tr><td>Máy tính bảng cổng chính</td><td>Quét thẻ QR</td><td>Cổng chính · Vào và ra</td><td><span class="nhan tc">Đang hoạt động</span></td><td>07:21 hôm nay</td><td><button class="nut nho">Sửa</button></td></tr>
          <tr><td>Máy chấm công phòng hội đồng</td><td>Máy chấm công khuôn mặt</td><td>Phòng hội đồng · Vào và ra</td><td><span class="nhan tc">Đang hoạt động</span></td><td>07:05 hôm nay</td><td><button class="nut nho">Khóa kết nối</button></td></tr>

    quyen: 'Chỉ cha, mẹ hoặc người giám hộ đã liên kết với học sinh mới quyết định được việc đồng ý.' },
  'thong-bao': { ung: 'Phụ huynh', nguoi: 'Chị Nguyễn Thị Mai · Phụ huynh',
    ghi: 'MH-643 · Ứng dụng phụ huynh · Thông báo đẩy, dòng thời gian đến và về, đính chính khi nhận nhầm, cài đặt thông báo.',
    rong: ['Hôm nay chưa có lượt qua cổng nào của con', 'Nếu con đã đến trường, có thể thiết bị chưa nhận ra con. Cô chủ nhiệm vẫn điểm danh trong lớp.', ''],
    quyen: 'Trường của con chưa bật thông báo đến và về.' },
};

const $ = s => document.querySelector(s);
function hienToast(chu) { const t = $('#toast'); t.textContent = chu; t.classList.add('mo'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('mo'), 3000); }
function moHop(html) { $('#hop').innerHTML = html; $('#lop-phu').classList.add('mo'); $('#hop').querySelector('button')?.focus(); }
function dongHop() { $('#lop-phu').classList.remove('mo'); }

function ve() {
  const mh = $('#chon-man-hinh').value, tt = $('#chon-trang-thai').value, info = thongTin[mh];
  $('#khung').className = 'khung ' + $('#chon-co').value;
  $('#ten-ung-dung').textContent = info.ung; $('#nguoi-dung').textContent = info.nguoi; $('#ghi-chu').textContent = info.ghi;
  const vung = $('#vung-noi-dung');
  if (tt === 'dang-tai') { vung.innerHTML = '<div class="noi-dung" aria-busy="true"><div class="xuong" style="width:40%;height:24px"></div>' + '<div class="xuong"></div>'.repeat(8) + '</div>'; return; }
  if (tt === 'loi') { vung.innerHTML = '<div class="noi-dung"><div class="trang-thai-chung"><h2>Không tải được dữ liệu</h2><p>Máy chủ không phản hồi. Kiểm tra kết nối mạng rồi thử lại; nếu vẫn lỗi, báo quản trị trường.</p><button class="nut chinh" data-hanh-dong="thu-lai">Thử lại</button></div></div>'; return; }
  if (tt === 'khong-quyen') { vung.innerHTML = `<div class="noi-dung"><div class="trang-thai-chung"><h2>Không có quyền xem</h2><p>${info.quyen}</p></div></div>`; return; }
  if (tt === 'rong') { const [a, b, c] = info.rong; vung.innerHTML = `<div class="noi-dung"><div class="trang-thai-chung"><h2>${a}</h2><p>${b}</p>${c ? `<button class="nut chinh">${c}</button>` : ''}</div></div>`; return; }
  vung.innerHTML = ''; vung.appendChild($('#mh-' + mh).content.cloneNode(true));
  if (mh === 'diem-danh') veDiemDanh(vung);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    const vung = tab.closest('.noi-dung');
    vung.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b === tab));
    vung.querySelectorAll('[data-ngan]').forEach(s => s.classList.toggle('an', s.dataset.ngan !== tab.dataset.tab));
    return;
  }
  const nut = e.target.closest('[data-hanh-dong]'); if (!nut) return;
  const hs = hocSinh[nut.dataset.i];
  switch (nut.dataset.hanhDong) {
    case 'xem-anh': moHop(`<h2 id="tieu-de-hop">Cần xem: ${hs.ten}?</h2>
      <div class="anh-gia">Ảnh cắt khuôn mặt lúc 07:09, cổng chính.<br>Ảnh mở trực tiếp từ trạm camera, chỉ xem được khi máy đang ở mạng của trường; tự xóa sau 1 ngày.</div>
      <p class="chu-phu">Độ tin cậy 0,68. Gần giống: Phạm Gia Bảo (0,68), Phạm Gia Huy lớp 9C (0,61).</p>
      <div class="hang" style="justify-content:flex-end"><button class="nut" data-hanh-dong="dong">Để sau</button><button class="nut nguy-hiem" data-hanh-dong="khong-phai">Không phải em này</button><button class="nut chinh" data-hanh-dong="dung-em">Đúng em này</button></div>`); break;
    case 'bao-nham': moHop(`<h2 id="tieu-de-hop">Báo nhận nhầm ${hs.ten}?</h2><p>Lượt vào lúc 07:05 sẽ bị hủy. Phụ huynh đã nhận thông báo "đã vào trường" sẽ nhận tin đính chính. Không hoàn tác được.</p>
      <div class="hang" style="justify-content:flex-end"><button class="nut" data-hanh-dong="dong">Hủy</button><button class="nut nguy-hiem" data-hanh-dong="xac-nhan-nham">Báo nhận nhầm</button></div>`); break;
    case 'rut-dong-y': moHop(`<h2 id="tieu-de-hop">Rút lại đồng ý?</h2><p>Đặc trưng khuôn mặt của Bảo Ngọc sẽ bị xóa khỏi thiết bị của trường trong vòng 15 phút. Con sẽ dùng thẻ QR hoặc được cô điểm danh tay. Anh chị có thể đồng ý lại sau, khi đó con cần đăng ký lại tại trường.</p>
      <div class="hang" style="justify-content:flex-end"><button class="nut" data-hanh-dong="dong">Giữ nguyên</button><button class="nut nguy-hiem" data-hanh-dong="xac-nhan-rut">Rút lại và xóa</button></div>`); break;
    case 'chua-den': moHop(`<h2 id="tieu-de-hop">Báo nhà trường: con chưa đến trường?</h2><p>Cô chủ nhiệm lớp 7A sẽ nhận tin ngay và kiểm tra lại lượt vào lúc 07:08.</p>
      <div class="truong"><label for="loi-nhan">Lời nhắn (không bắt buộc)</label><input class="o-nhap" id="loi-nhan" style="width:100%" placeholder="Ví dụ: hôm nay con nghỉ ốm ở nhà"></div>
      <div class="hang" style="justify-content:flex-end"><button class="nut" data-hanh-dong="dong">Hủy</button><button class="nut chinh" data-hanh-dong="gui-bao">Gửi</button></div>`); break;
    case 'dong': dongHop(); break;
    case 'dung-em': dongHop(); hienToast('Đã xác nhận Phạm Gia Bảo vào trường lúc 07:09. Gợi ý: Có mặt.'); break;
    case 'khong-phai': dongHop(); hienToast('Đã bỏ lượt này. Trạm ghi lại để nhà trường đăng ký lại ảnh.'); break;
    case 'xac-nhan-nham': dongHop(); hienToast('Đã hủy lượt và gửi đính chính cho phụ huynh.'); break;
    case 'xac-nhan-rut': dongHop(); hienToast('Đã rút lại đồng ý. Nhà trường sẽ xóa dữ liệu trong 15 phút.'); break;
    case 'gui-bao': dongHop(); hienToast('Đã gửi cho cô chủ nhiệm.'); break;
    case 'gui-dong-y': nut.disabled = true; nut.textContent = 'Đang gửi...'; setTimeout(() => { nut.disabled = false; nut.textContent = 'Gửi quyết định'; hienToast('Đã gửi. Con cần xác nhận lại trong ứng dụng học sinh.'); }, 900); break;
    case 'xac-nhan-goi-y': hienToast('Đã điền "Có mặt" hoặc "Đi muộn" cho 31 học sinh. Còn 5 học sinh chưa chọn trạng thái.'); break;
    case 'luu': nut.disabled = true; nut.textContent = 'Đang lưu...'; setTimeout(() => { nut.disabled = false; nut.textContent = 'Lưu điểm danh'; hienToast('Chưa lưu: còn 2 học sinh chưa chọn trạng thái (Võ Thị Khánh Linh, Huỳnh Ngọc Phương Thảo Nguyên Khánh Vy).'); }, 900); break;
    case 'luu-loi': hienToast('Chưa lưu: kiểm tra ô "Ngưỡng cần xem".'); document.getElementById('nguong-xem').focus(); break;
    case 'them-thiet-bi': hienToast('Mở biểu mẫu thêm thiết bị (chưa dựng trong bản mẫu).'); break;
    case 'thu-lai': $('#chon-trang-thai').value = 'du-lieu'; ve(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') dongHop(); });
$('#lop-phu').addEventListener('click', e => { if (e.target.id === 'lop-phu') dongHop(); });
['#chon-man-hinh', '#chon-co', '#chon-trang-thai'].forEach(s => $(s).addEventListener('change', ve));
ve();
</script>
</body>
</html>
