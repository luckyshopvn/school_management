<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản mẫu YCTD-396: kho minh chứng dùng chung</title>
<!-- Bản mẫu YCTD-396: kho minh chứng dùng chung cho kiểm định chất lượng và các bộ tiêu chí khác, ở phân hệ "Minh chứng và kiểm định" của cổng quản trị. Khung và biến lấy từ bản mẫu YCTD-385 (phong cách "Hành chính hiện đại", YCTD-384). Dữ liệu, tên trường, tên người đều giả. Mở thẳng tệp bằng trình duyệt; thanh trên cùng chọn màn hình, khổ, trạng thái. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ===== Biến chung (đề xuất tài liệu 15, YCTD-384) ===== */
  :root {
    --font: 'Be Vietnam Pro', system-ui, sans-serif;
    --text-page-title: 24px; --text-section-title: 18px; --text-subtitle: 16px; --text-content: 15px; --text-label: 14px; --text-metric: 28px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --touch: 44px;
    /* Màu trạng thái, dùng chung cho hai phong cách */
    --success-bg: #e3f4ea; --success: #1d6b43; --warning-bg: #fdf0d8; --warning: #7a4600; --danger-bg: #fdecec; --danger: #b91c1c;
    --info-bg: #e8eef7; --info: #04497d; --neutral-bg: #eef1f4; --neutral: #4a5562;
  }
  /* Hành chính hiện đại */
  .pc-hanh-chinh {
    --page: #f4f6f9; --card: #ffffff; --text: #17202a; --muted: #5d6875; --border: #dde2e8; --line: #eef1f4; --input-border: #7d8896;
    --accent: #1f4e8c; --accent-strong: #163a69; --accent-soft: #e8eef7;
    --side: #12304f; --side-text: #dbe6f3; --side-muted: #a9bcd2; --side-on: #1f4e8c; --side-line: #2a4a6e;
    --radius-sm: 8px; --radius-lg: 12px; --radius-pill: 8px; --shadow: none;
  }
  /* Thân thiện theo vai: nền chung, mỗi vai một màu nhấn */
  .pc-theo-vai {
    --page: #fbf8f3; --card: #ffffff; --text: #1f2a24; --muted: #5c6660; --border: #e7e1d8; --line: #f1ece4; --input-border: #8a8174;
    --radius-sm: 12px; --radius-lg: 16px; --radius-pill: 999px; --shadow: 0 2px 6px rgb(60 45 20 / 5%);
  }
  .vai-giao-vien { --accent: #0f6b5f; --accent-strong: #0b564c; --accent-soft: #e1f1ec; }
  .vai-phu-huynh { --accent: #1f5fa8; --accent-strong: #184c87; --accent-soft: #e6eef9; }
  .vai-hoc-sinh { --accent: #6d28d9; --accent-strong: #5b21b6; --accent-soft: #efe7fd; }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: #d9dee5; color: #17202a; }
  /* ===== Thanh chọn của bản mẫu (không thuộc thiết kế) ===== */
  .bm-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 10px 16px; background: #fff; border-bottom: 1px solid #c9d0d9; font-size: 14px; }
  .bm-bar label { display: flex; flex-direction: column; gap: 2px; font-weight: 600; }
  .bm-bar select { height: 40px; font: 15px var(--font); padding: 0 8px; border: 1px solid #7d8896; border-radius: 6px; }
  .bm-bar .bm-note { color: #4a5562; font-weight: 400; max-width: 520px; }
  .bm-stage { padding: 24px 16px 48px; display: flex; justify-content: center; }
  .bm-frame { container-type: inline-size; container-name: khung; background: #fff; box-shadow: 0 4px 24px rgb(0 0 0 / 18%); overflow: hidden; position: relative; }
  .bm-frame[data-kho="390"] { border-radius: 28px; border: 8px solid #1d232b; }

  /* ===== Thành phần dùng chung ===== */
  .ung-dung { font-family: var(--font); color: var(--text); background: var(--page); font-size: var(--text-content); line-height: 1.5; min-height: 100%; }
  .btn { min-height: var(--touch); padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--input-border); background: var(--card); color: var(--text); font: 600 15px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; }
  .btn.chinh { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.chinh:hover { background: var(--accent-strong); }
  .btn.chu { border-color: transparent; background: transparent; color: var(--accent-strong); padding: 0 8px; }
  .btn.vuong { width: var(--touch); padding: 0; }
  .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
  .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 999px; font-size: var(--text-label); font-weight: 600; white-space: nowrap; }
  .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.tc { background: var(--success-bg); color: var(--success); } .badge.cb { background: var(--warning-bg); color: var(--warning); }
  .badge.nh { background: var(--danger-bg); color: var(--danger); } .badge.tt { background: var(--info-bg); color: var(--info); } .badge.trung { background: var(--neutral-bg); color: var(--neutral); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: var(--text-label); font-weight: 600; }
  .field > span em { font-style: normal; color: var(--danger); }
  .field input, .field select, .field textarea, .search input { min-height: var(--touch); font: 16px var(--font); color: var(--text); padding: 0 12px; border: 1px solid var(--input-border); border-radius: var(--radius-sm); background: var(--card); width: 100%; }
  .field small { font-size: var(--text-label); color: var(--muted); }
  .field.loi input, .field.loi select { border-color: var(--danger); border-width: 2px; }
  .field .thong-bao-loi { color: var(--danger); font-size: var(--text-label); font-weight: 500; }
  .dai { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-sm); font-size: var(--text-content); }
  .dai.tt { background: var(--info-bg); color: var(--info); } .dai.nh { background: var(--danger-bg); color: var(--danger); } .dai.tc { background: var(--success-bg); color: var(--success); }
  .dai .noi-dung { flex: 1; min-width: 0; }
  .dai.chon-nhieu { align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 6px 8px 6px 16px; }
  .dai.chon-nhieu .dem { margin-right: auto; }
  .dai b { color: inherit; }
  .icon { width: 20px; height: 20px; flex: none; }
  .muted { color: var(--muted); font-size: var(--text-label); }
  .xuong { background: linear-gradient(90deg, var(--line) 0%, #e9edf2 50%, var(--line) 100%); background-size: 200% 100%; animation: xuong 1.4s infinite; border-radius: 8px; }
  @keyframes xuong { to { background-position: -200% 0; } }
  .khoi-rong { text-align: center; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .khoi-rong .minh-hoa { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; }
  .khoi-rong .minh-hoa svg { width: 34px; height: 34px; }
  .khoi-rong h3 { margin: 0; font-size: var(--text-section-title); }
  .khoi-rong p { margin: 0; color: var(--muted); max-width: 420px; }
  .thong-bao-noi { position: absolute; top: 16px; right: 16px; z-index: 30; max-width: min(380px, calc(100% - 32px)); display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--success); border-radius: var(--radius-sm); box-shadow: 0 6px 20px rgb(0 0 0 / 14%); font-size: var(--text-content); }
  .an-dt { } .chi-dt { display: none !important; }

  /* ===== Khung hành chính ===== */
  .hc { display: grid; grid-template-columns: 256px 1fr; min-height: 820px; }
  .hc-side { background: var(--side); color: var(--side-text); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .hc-ten-truong { color: #fff; font-weight: 700; font-size: 16px; line-height: 1.3; padding: 4px 8px 12px; display: flex; gap: 10px; align-items: center; }
  .hc-ten-truong .logo { width: 36px; height: 36px; flex: none; border-radius: 8px; background: var(--side-on); display: grid; place-items: center; font-size: 15px; }
  .hc-phan-he { display: flex; align-items: center; gap: 10px; min-height: 52px; margin: 0 0 8px; padding: 6px 10px; border: 1px solid var(--side-line); border-radius: 8px; color: #fff; font-size: 15px; font-weight: 600; background: transparent; width: 100%; text-align: left; font-family: var(--font); }
  .hc-phan-he small { display: block; color: var(--side-muted); font-weight: 500; font-size: 14px; }
  .hc-muc { display: flex; align-items: center; gap: 10px; min-height: var(--touch); padding: 0 10px; border-radius: 8px; font-size: 15px; color: var(--side-text); }
  .hc-muc.mo { color: #fff; font-weight: 600; }
  .hc-muc.chon { background: var(--side-on); color: #fff; font-weight: 600; }
  .hc-muc.con { padding-left: 40px; font-size: 15px; }
  .hc-muc .mui { margin-left: auto; opacity: .8; }
  .hc-muc .so { min-width: 26px; color: var(--side-muted); }
  .hc-muc.chon .so, .hc-muc.mo .so { color: #fff; }
  .hc-ke { border-top: 1px solid var(--side-line); margin: 10px 0; }
  .hc-main { min-width: 0; display: flex; flex-direction: column; }
  .hc-top { position: sticky; top: 0; z-index: 10; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--border); }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); }
  .search input { padding-left: 40px; }
  .hc-ngu-canh { min-height: var(--touch); border: 1px solid var(--input-border); border-radius: 8px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; white-space: nowrap; background: var(--card); }
  .hc-top .khoang { flex: 1; }
  .so-dem { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--danger); color: #fff; font-size: 14px; font-weight: 700; display: inline-grid; place-items: center; }
  .anh-dai-dien { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 15px; }
  .hc-noi-dung { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; max-width: 1440px; width: 100%; }
  .hc-dai-thong-bao { display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; min-height: 48px; background: var(--info-bg); color: var(--info); border-radius: 8px; font-size: 15px; }
  .hc-dai-thong-bao .noi-dung { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .duong-dan { font-size: var(--text-label); color: var(--muted); }
  .tieu-de-trang { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tieu-de-trang h1 { margin: 0; font-size: var(--text-page-title); line-height: 1.3; flex: 1; min-width: 200px; }
  .chi-so { display: grid; grid-template-columns: repeat(5, 1fr); }
  .chi-so > a { padding: 16px; border-right: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 110px; display: flex; flex-direction: column; gap: 2px; }
  .chi-so > a:last-child { border-right: 0; }
  .chi-so .gia-tri { font-size: var(--text-metric); font-weight: 700; line-height: 1.2; }
  .luoi-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  .the-tieu-de { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .the-tieu-de h2 { margin: 0; font-size: var(--text-section-title); }
  .dong-viec { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border-top: 1px solid var(--line); }
  .dong-viec .noi { flex: 1; min-width: 0; }
  .dong-viec .noi small { display: block; color: var(--muted); font-size: 14px; }
  .thanh-cong-cu { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .thanh-cong-cu .search { max-width: 360px; }
  .loc { display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
  .chip { min-height: var(--touch); padding: 0 14px; border-radius: 999px; border: 1px solid var(--input-border); display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; background: var(--card); color: var(--text); font-family: var(--font); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .bang-cuon { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  caption { text-align: left; padding: 0; height: 0; overflow: hidden; }
  th { text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td.ten { min-width: 220px; } td.ten b { font-weight: 600; } td.ten small { display: block; color: var(--muted); font-size: 14px; }
  td.chon, th.chon { width: 48px; } td input[type=checkbox], th input[type=checkbox] { width: 20px; height: 20px; }
  td.so-tien { text-align: right; white-space: nowrap; }
  .phan-trang { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .phan-trang .khoang { flex: 1; }
  .the-dong { display: none; }
  .bieu-mau { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  .bieu-mau .rong { grid-column: 1 / -1; }
  .khoi-bm h2 { margin: 0; padding: 14px 16px 0; font-size: var(--text-section-title); }
  .chan-bm { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--border); }
  .hc-dt-nav { display: none; }

  /* Máy tính bảng: thanh bên thu thành dải biểu tượng 72 điểm ảnh */
  @container khung (max-width: 1279px) {
    .hc { grid-template-columns: 72px 1fr; }
    .hc-side { padding: 12px 8px; align-items: center; }
    .hc-ten-truong span, .hc-phan-he .chu-phan-he, .hc-muc .nhan, .hc-muc .mui, .hc-muc.con, .hc-muc .so { display: none; }
    .hc-ten-truong { padding: 4px 0 12px; }
    .hc-phan-he { width: 56px; height: 52px; justify-content: center; padding: 0; }
    .hc-muc { width: 56px; justify-content: center; padding: 0; }
    .chi-so { grid-template-columns: repeat(3, 1fr); }
    .chi-so > a:nth-child(3) { border-right: 0; }
    .chi-so > a:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
    .luoi-2 { grid-template-columns: 1fr; }
    .hc-top { padding: 0 16px; }
    .hc-noi-dung { padding: 16px; }
    .an-bang { display: none; }
  }
  /* Điện thoại: bỏ thanh bên, thanh đầu gọn, bảng thành thẻ */
  @container khung (max-width: 767px) {
    .hc { grid-template-columns: 1fr; min-height: 780px; }
    .hc-side { display: none; }
    .hc-top { height: 56px; padding: 0 4px 0 4px; gap: 4px; background: var(--side); border: 0; color: #fff; }
    .hc-top .btn.vuong { color: #fff; }
    .hc-top .search, .hc-ngu-canh, .an-dt { display: none !important; }
    .chi-dt { display: inline-flex !important; }
    .hc-top .ten-dt { flex: 1; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hc-noi-dung { padding: 12px; gap: 12px; }
    .tieu-de-trang h1 { font-size: 22px; min-width: 0; }
    .chi-so { grid-template-columns: 1fr 1fr; }
    .chi-so > a { min-height: 96px; border-bottom: 1px solid var(--line); }
    .chi-so > a:nth-child(odd) { border-right: 1px solid var(--line); } .chi-so > a:nth-child(even) { border-right: 0; }
    .chi-so > a:last-child { grid-column: 1 / -1; border-bottom: 0; }
    .thanh-cong-cu .search { max-width: none; flex-basis: 100%; }
    .bang-cuon.thanh-the table { display: none; }
    .bang-cuon.thanh-the .the-dong { display: block; }
    .bieu-mau { grid-template-columns: 1fr; padding: 12px; }
    .hc-dai-thong-bao { min-height: 44px; }
    .tieu-de-trang .btn.chinh .nhan-dai { display: none; }
  }
  .the-dong > a { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; min-height: 72px; }
  .the-dong .noi { flex: 1; min-width: 0; }
  .the-dong .noi b { display: block; font-weight: 600; }
  .the-dong .noi small { display: block; color: var(--muted); font-size: 14px; }

  /* ===== Riêng YCTD-385: biểu thống kê, duyệt, khóa ===== */
  .the-bieu { display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .the-bieu button { min-height: var(--touch); padding: 0 14px; border: 0; border-bottom: 3px solid transparent; background: transparent; font: 600 15px var(--font); color: var(--muted); cursor: pointer; white-space: nowrap; flex: none; }
  .the-bieu button[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); }
  .bang-bieu th, .bang-bieu td { white-space: nowrap; }
  .bang-bieu td.chi-tieu { white-space: normal; min-width: 320px; }
  .bang-bieu td.so, .bang-bieu th.so { text-align: right; font-variant-numeric: tabular-nums; }
  .bang-bieu tr.de-muc td { font-weight: 700; background: var(--line); }
  .bang-bieu tr.dam td.chi-tieu { font-weight: 600; }
  .bang-bieu td.cap-2 { padding-left: 28px; } .bang-bieu td.cap-3 { padding-left: 44px; }
  .bang-bieu th.nhom { text-align: center; border-bottom: 0; color: var(--text); }
  .bang-bieu td.nhap input { width: 88px; min-height: 40px; text-align: right; font: 16px var(--font); border: 1px solid var(--input-border); border-radius: 6px; padding: 0 8px; }
  .bang-bieu td.nhap input:disabled { background: var(--line); color: var(--muted); border-color: var(--border); }
  .bang-bieu .co-dinh { position: sticky; left: 0; background: var(--card); z-index: 1; }
  .bang-bieu tr.de-muc .co-dinh { background: var(--line); }
  .nguon { font-size: 14px; color: var(--muted); }
  .nguon.tay { color: var(--warning); font-weight: 600; }
  .hang-trang-thai { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dong-thoi-gian { list-style: none; margin: 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .dong-thoi-gian li { display: flex; gap: 12px; }
  .dong-thoi-gian li::before { content: ''; width: 10px; height: 10px; margin-top: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .dong-thoi-gian small { display: block; color: var(--muted); font-size: 14px; }
  .hop-thoai-nen { position: absolute; inset: 0; background: rgb(18 32 50 / 45%); display: grid; place-items: center; z-index: 40; padding: 16px; }
  .hop-thoai { background: var(--card); border-radius: var(--radius-lg); width: min(520px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 20px; box-shadow: 0 12px 32px rgb(0 0 0 / 25%); }
  .hop-thoai h2 { margin: 0; font-size: var(--text-section-title); }
  .hop-thoai textarea { min-height: 112px; padding: 10px 12px; font: 16px var(--font); border: 1px solid var(--input-border); border-radius: var(--radius-sm); }
  .hop-thoai .chan { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .o-so { display: grid; grid-template-columns: repeat(5, 1fr); }
  .o-so > button { border: 0; border-right: 1px solid var(--line); background: var(--card); padding: 14px 16px; text-align: left; font-family: var(--font); color: var(--text); cursor: pointer; min-height: 88px; }
  .o-so > button:last-child { border-right: 0; }
  .o-so > button[aria-pressed="true"] { background: var(--accent-soft); }
  .o-so b { display: block; font-size: var(--text-metric); line-height: 1.2; }
  .o-so span { font-size: 14px; color: var(--muted); }
  .luoi-chi-tiet { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }

// ===== Thanh chọn của bản mẫu =====
const TEN_TRANG_THAI = {
  'du-lieu': 'Có dữ liệu', rong: 'Rỗng', tai: 'Đang tải', loi: 'Lỗi', quyen: 'Không có quyền', 'thanh-cong': 'Thao tác thành công',
  'nguon-doi': 'Nguồn đã thay đổi', 'han-che': 'Minh chứng hạn chế', 'het-han': 'Hết hiệu lực',
  'ban-ghi': 'Nguồn: dữ liệu trong phần mềm', tep: 'Nguồn: tải tệp lên', 'loi-nhap': 'Lỗi nhập liệu',
  'chi-thieu': 'Chỉ tiêu chí thiếu', 'chon-nhieu': 'Chọn nhiều', 'hop-nap-mau': 'Hộp thoại nạp bộ mẫu',
  'loi-ma': 'Mã trích dẫn không có trong danh mục', 'dang-tao': 'Đang tạo gói ZIP',
  'hop-thoai': 'Hộp thoại gắn', 'da-gan': 'Đã gắn',
};
const chonMan = document.getElementById('chon-man');
const chonTt = document.getElementById('chon-tt');
for (const [ma, m] of Object.entries(MAN)) chonMan.appendChild(new Option(m.ten, ma));
function napTrangThai() {
  const cu = chonTt.value;
  chonTt.innerHTML = '';
  for (const t of MAN[chonMan.value].trangThai) chonTt.appendChild(new Option(TEN_TRANG_THAI[t], t));
  if (MAN[chonMan.value].trangThai.includes(cu)) chonTt.value = cu;
}
const thamSo = new URLSearchParams(location.hash.slice(1));
if (thamSo.get('man') && MAN[thamSo.get('man')]) chonMan.value = thamSo.get('man');
if (thamSo.get('kho')) document.getElementById('chon-kho').value = thamSo.get('kho');
napTrangThai();
if (thamSo.get('tt')) chonTt.value = thamSo.get('tt');
function ve() {
  const ma = chonMan.value, kho = document.getElementById('chon-kho').value, tt = chonTt.value;
  const khung = document.getElementById('khung');
  khung.dataset.kho = kho;
  khung.style.width = (Number(kho) + (kho === '390' ? 16 : 0)) + 'px';
  khung.innerHTML = MAN[ma].ve(tt);
  document.getElementById('ghi-chu').textContent = MAN[ma].ghi;
  history.replaceState(null, '', `#man=${ma}&kho=${kho}&tt=${tt}`);
}
chonMan.addEventListener('change', () => { napTrangThai(); ve(); });
for (const id of ['chon-kho', 'chon-tt']) document.getElementById(id).addEventListener('change', ve);
ve();
</script>
</body>
</html>
