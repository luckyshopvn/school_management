# Tích hợp liên tục: chỉ kiểm tra và kiểm thử, chưa triển khai (YCTD-32)
name: Kiem thu

on:
  push:
    branches: [main]
  pull_request:
  # Chạy đủ khổ thiết bị hằng đêm, khoảng 2 giờ sáng giờ Việt Nam (19 giờ UTC); chỉ việc kiem-thu-thiet-bi cần kết quả này
  schedule:
    - cron: '0 19 * * *'

jobs:
  kiem-thu:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_quan_tri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_quan_tri
      POSTGRES_USER: postgres
      IDENTITY_DATABASE_PASSWORD: ci_dinh_danh
      API_DATABASE_PASSWORD: ci_may_chu_api
      IDENTITY_DATABASE_URL: postgres://identity_service:ci_dinh_danh@localhost:5432/school_identity
      SYSTEM_DATABASE_URL: postgres://api_service:ci_may_chu_api@localhost:5432/school_system
      REDIS_URL: redis://localhost:6379
      IDENTITY_BASE_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: school-files
      S3_ACCESS_KEY_ID: kiem_thu
      S3_SECRET_ACCESS_KEY: kiem_thu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bảng khóa của PostgreSQL như hồ sơ VPS (max_locks_per_transaction 256): khối services không truyền được tham số khởi động nên đặt
      # bằng ALTER SYSTEM rồi khởi động lại. Mã không dựa vào mức này (chạy tệp thay đổi cấu trúc, gỡ lược đồ theo từng giao dịch nhỏ).
      # Kiểm thử máy chủ API chạy ba tệp song song, mỗi tệp vài nhóm kết nối, nên nâng số kết nối tối đa như hồ sơ VPS (300)
      - run: |
          psql -h localhost -U postgres -c "alter system set max_locks_per_transaction = 256"
          psql -h localhost -U postgres -c "alter system set max_connections = 300"
          docker restart "$(docker ps -q --filter ancestor=postgres:17-alpine)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      # Kho tệp tương thích S3; khối services không truyền được lệnh khởi động nên chạy bằng docker run
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:3.80 server -s3 -dir=/data
      - run: sh docker/postgres/create-databases.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm database:migrate
      - run: pnpm test

  # Kiểm thử giao diện chạy song song với việc kiem-thu (tối ưu thời gian CI): hai việc độc lập, mỗi việc tự dựng cơ sở dữ liệu
  kiem-thu-giao-dien:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_quan_tri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_quan_tri
      POSTGRES_USER: postgres
      IDENTITY_DATABASE_PASSWORD: ci_dinh_danh
      API_DATABASE_PASSWORD: ci_may_chu_api
      IDENTITY_DATABASE_URL: postgres://identity_service:ci_dinh_danh@localhost:5432/school_identity
      SYSTEM_DATABASE_URL: postgres://api_service:ci_may_chu_api@localhost:5432/school_system
      REDIS_URL: redis://localhost:6379
      IDENTITY_BASE_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: school-files
      S3_ACCESS_KEY_ID: kiem_thu
      S3_SECRET_ACCESS_KEY: kiem_thu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Như việc kiem-thu: bảng khóa của PostgreSQL như hồ sơ VPS
      - run: |
          psql -h localhost -U postgres -c "alter system set max_locks_per_transaction = 256"
          docker restart "$(docker ps -q --filter ancestor=postgres:17-alpine)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:3.80 server -s3 -dir=/data
      - run: sh docker/postgres/create-databases.sh
      - run: pnpm build
      - run: pnpm database:migrate
      # Khóa ký mã phiên chỉ dùng cho lần chạy kiểm thử này
      - run: node apps/identity/dist/generate-token-keys.js >> "$GITHUB_ENV"
      - run: node apps/api/dist/generate-data-keys.js >> "$GITHUB_ENV"
      - run: pnpm --filter @school-management/tests exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Giữ dấu vết và ảnh chụp của ca hỏng để chẩn đoán
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ket-qua-kiem-thu-giao-dien
          path: tests/test-results/
          retention-days: 7

  # Kiểm thử theo khổ thiết bị (DT-26 phần 26c, YCTD-233), chạy song song với kiem-thu-giao-dien (không nối đuôi); dựng một lần trong việc, cùng cách dựng cơ sở dữ liệu
  kiem-thu-thiet-bi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Yêu cầu kéo: một mảnh, tập con nhãn @thiet-bi-pr ở dien-thoai và may-tinh-bang-doc, chỉ Chromium. Nhánh chính và hằng đêm: hai mảnh,
    # mọi spec @thiet-bi ở bốn dự án thiết bị (thêm WebKit). Hằng đêm hỏng thì xem bản tóm tắt của lần chạy, không chặn yêu cầu kéo
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'pull_request' && fromJSON('["1/1"]') || fromJSON('["1/2","2/2"]') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_quan_tri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_quan_tri
      POSTGRES_USER: postgres
      IDENTITY_DATABASE_PASSWORD: ci_dinh_danh
      API_DATABASE_PASSWORD: ci_may_chu_api
      IDENTITY_DATABASE_URL: postgres://identity_service:ci_dinh_danh@localhost:5432/school_identity
      SYSTEM_DATABASE_URL: postgres://api_service:ci_may_chu_api@localhost:5432/school_system
      REDIS_URL: redis://localhost:6379
      IDENTITY_BASE_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: school-files
      S3_ACCESS_KEY_ID: kiem_thu
      S3_SECRET_ACCESS_KEY: kiem_thu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Như việc kiem-thu: bảng khóa của PostgreSQL như hồ sơ VPS
      - run: |
          psql -h localhost -U postgres -c "alter system set max_locks_per_transaction = 256"
          docker restart "$(docker ps -q --filter ancestor=postgres:17-alpine)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:3.80 server -s3 -dir=/data
      - run: sh docker/postgres/create-databases.sh
      - run: pnpm build
      - run: pnpm database:migrate
      # Khóa ký mã phiên chỉ dùng cho lần chạy kiểm thử này
      - run: node apps/identity/dist/generate-token-keys.js >> "$GITHUB_ENV"
      - run: node apps/api/dist/generate-data-keys.js >> "$GITHUB_ENV"
      - name: Cài trình duyệt
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm --filter @school-management/tests exec playwright install --with-deps chromium
          else
            pnpm --filter @school-management/tests exec playwright install --with-deps chromium webkit
          fi
      - name: Kiểm thử theo khổ thiết bị
        run: pnpm --filter @school-management/tests e2e -- --shard=${{ matrix.shard }}
        env:
          E2E_DEVICES: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
          E2E_SCREENSHOTS: '1'
      # Giữ dấu vết và ảnh chụp của ca hỏng để chẩn đoán
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ket-qua-kiem-thu-thiet-bi-${{ strategy.job-index }}
          path: tests/test-results/
          retention-days: 7

  # Nền tảng nhiều trường (DT-SaaS phần S1a, tài liệu 32 mục 14.7): một dịch vụ định danh, một máy chủ API phục vụ nhiều trường theo
  # tên miền con *.e2e.localhost; kiểm thử giao diện nhiều trường ở cả hai bố cục cơ sở dữ liệu (database, schema). Kiểm tĩnh và
  # kiểm thử đơn vị cách ly chạy ở việc kiem-thu (pnpm test)
  kiem-thu-nhieu-truong:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci_quan_tri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_quan_tri
      POSTGRES_USER: postgres
      IDENTITY_DATABASE_PASSWORD: ci_dinh_danh
      API_DATABASE_PASSWORD: ci_may_chu_api
      IDENTITY_DATABASE_URL: postgres://identity_service:ci_dinh_danh@localhost:5432/school_identity
      SYSTEM_DATABASE_URL: postgres://api_service:ci_may_chu_api@localhost:5432/school_system
      REDIS_URL: redis://localhost:6379
      IDENTITY_BASE_URL: http://localhost:3001
      API_BASE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: school-files
      S3_ACCESS_KEY_ID: kiem_thu
      S3_SECRET_ACCESS_KEY: kiem_thu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bảng khóa của PostgreSQL như hồ sơ VPS (max_locks_per_transaction 256): khối services không truyền được tham số khởi động nên đặt
      # bằng ALTER SYSTEM rồi khởi động lại. Mã không dựa vào mức này (chạy tệp thay đổi cấu trúc, gỡ lược đồ theo từng giao dịch nhỏ)
      - run: |
          psql -h localhost -U postgres -c "alter system set max_locks_per_transaction = 256"
          docker restart "$(docker ps -q --filter ancestor=postgres:17-alpine)"
          until pg_isready -h localhost -U postgres; do sleep 1; done
      - run: pnpm build
      # Khóa ký mã phiên chỉ dùng cho lần chạy kiểm thử này
      - run: node apps/identity/dist/generate-token-keys.js >> "$GITHUB_ENV"
      - run: pnpm --filter @school-management/tests exec playwright install --with-deps chromium
      - name: Giao diện nhiều trường, bố cục database
        run: pnpm --filter @school-management/tests e2e:multi
      - name: Giao diện nhiều trường, bố cục schema (hồ sơ thử nghiệm)
        run: pnpm --filter @school-management/tests e2e:multi
        env:
          E2E_TENANT_LAYOUT: schema
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ket-qua-kiem-thu-nhieu-truong
          path: tests/test-results/
          retention-days: 7

  # Quét thành phần phụ thuộc có lỗ hổng mức cao trở lên ở phần chạy thật (DT-SaaS phần S8b, YCTD-201). Báo cáo không chặn gộp (continue-on-error)
  # vì lỗ hổng ở thư viện bên thứ ba cần thời gian nâng cấp; người duyệt đọc kết quả ở nhật ký việc này. Quét bí mật trong mã chạy ở
  # tests/tenancy/secret-scan.test.mjs thuộc pnpm test
  quet-phu-thuoc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # Dựng ảnh Docker của môi trường chạy thật (không đẩy lên kho ảnh) để phát hiện sớm Dockerfile hỏng (YCTD-92)
  dung-anh-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: deploy/docker/server.Dockerfile
            target: api
          - image: identity
            dockerfile: deploy/docker/server.Dockerfile
            target: identity
          - image: worker
            dockerfile: deploy/docker/server.Dockerfile
            target: worker
          - image: web
            dockerfile: deploy/docker/web.Dockerfile
            target: web
          # Ảnh gộp identity + api của hồ sơ thử nghiệm (DT-SaaS phần S9)
          - image: trial
            dockerfile: deploy/profiles/trial/container/Dockerfile.all-in-one
            target: all-in-one
          # PostgreSQL kèm WAL-G cho khôi phục về một thời điểm (DT-SaaS phần S7b)
          - image: postgres-walg
            dockerfile: docker/postgres-walg/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.image == 'web' }}
          tags: school-management/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Kiểm tra cú pháp tệp Docker Compose của môi trường chạy thật
        if: matrix.image == 'web'
        run: |
          cp deploy/.env.production.example deploy/.env
          sh deploy/scripts/generate-keys.sh deploy/.env
          docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env config --quiet
      - name: Kiểm tra cấu hình Caddy
        if: matrix.image == 'web'
        run: >-
          docker run --rm -e ACME_EMAIL=ci@example.com -e PORTAL_SITE=portal.example.com
          -e PARENT_SITE=phuhuynh.example.com -e TEACHER_SITE=giaovien.example.com -e API_SITE=api.example.com
          school-management/web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
